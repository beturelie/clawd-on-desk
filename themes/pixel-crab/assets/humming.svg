.al{animation:al .6s step-end infinite}.ar{animation:ar .6s step-end infinite}
@keyframes al{0%{transform:none}50%{transform:translateY(-1px)}}
@keyframes ar{0%{transform:translateY(-1px)}50%{transform:none}}
.n1{animation:nt 2.4s steps(6) infinite}.n2{animation:nt 2.4s steps(6) infinite;animation-delay:-1.2s}
@keyframes nt{0%{transform:none;opacity:1}100%{transform:translate(3px,-8px);opacity:0}}</style>
