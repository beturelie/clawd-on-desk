<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges">
<title>生气 (angry)</title>
<style>
.b{fill:#D97757}.b2{fill:#B65B3E}.k{fill:#221B17}.w{fill:#FFFFFF}
.p{fill:#FF8FA0}.p2{fill:#E8607A}.ang{fill:#E5484D}.ck{fill:#D9A55B}.sc{fill:#5B6FD6}.fi{fill:#4FA3C7}.sf{fill:#5DA9E9}.cap{fill:#4B5FC9}.cl{fill:#8F96A3}.wall{fill:#B9BFC7}.gd{fill:#2F8F5B}.brk{fill:#B5523B}.org{fill:#F08A3C}.scr{fill:#24302E}.ph{fill:#7FD99A}.r{fill:#E5484D}.y{fill:#F7C948}.c{fill:#7CC8F2}.gr{fill:#6BCB77}
.o{fill:#3A302B}.f{fill:#FBF6EE}.gy{fill:#9AA0A8}.gy2{fill:#C9CDD2}
.sh{fill:#000;opacity:.18}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.stomp{animation:stomp .3s step-end infinite}
@keyframes stomp{0%{transform:none}50%{transform:translateY(1px)}}
.flush{opacity:0;animation:flush 1s step-end infinite}
@keyframes flush{0%{opacity:0}50%{opacity:.35}}
.vein{animation:vein .5s step-end infinite}
@keyframes vein{0%{transform:none}50%{transform:scale(.6)}}
.puff{animation:puff 1.2s steps(4) infinite}.puff.t2{animation-delay:-.6s}
@keyframes puff{0%{transform:none;opacity:1}100%{transform:translateY(-6px);opacity:0}}
.al{animation:al .3s step-end infinite}.ar{animation:ar .3s step-end infinite}
@keyframes al{0%{transform:none}50%{transform:translateY(-2px)}}
@keyframes ar{0%{transform:translateY(-2px)}50%{transform:none}}</style>
<rect x="8" y="27" width="16" height="1" class="sh"/><g class="b"><rect x="8" y="24" width="2" height="3"/><rect x="11" y="24" width="2" height="3"/><rect x="19" y="24" width="2" height="3"/><rect x="22" y="24" width="2" height="3"/></g><g class="stomp"><g class="b"><rect x="7" y="13" width="18" height="11"/></g><g class="ang flush"><rect x="7" y="13" width="18" height="11"/></g><g class="b al"><rect x="4" y="17" width="3" height="3"/></g><g class="b ar"><rect x="25" y="17" width="3" height="3"/></g><g class="k"><rect x="8" y="13" width="2" height="1"/><rect x="10" y="14" width="2" height="1"/><rect x="22" y="13" width="2" height="1"/><rect x="20" y="14" width="2" height="1"/></g><g class="k"><rect x="10" y="16" width="2" height="2"/><rect x="20" y="16" width="2" height="2"/></g><rect x="15" y="20" width="1" height="1" class="k"/><rect x="16" y="20" width="1" height="1" class="k"/><rect x="14" y="21" width="1" height="1" class="k"/><rect x="17" y="21" width="1" height="1" class="k"/></g><g class="r vein fb"><rect x="24" y="3" width="1" height="1" class="r"/><rect x="25" y="3" width="1" height="1" class="r"/><rect x="27" y="3" width="1" height="1" class="r"/><rect x="28" y="3" width="1" height="1" class="r"/><rect x="24" y="4" width="1" height="1" class="r"/><rect x="28" y="4" width="1" height="1" class="r"/><rect x="24" y="6" width="1" height="1" class="r"/><rect x="28" y="6" width="1" height="1" class="r"/><rect x="24" y="7" width="1" height="1" class="r"/><rect x="25" y="7" width="1" height="1" class="r"/><rect x="27" y="7" width="1" height="1" class="r"/><rect x="28" y="7" width="1" height="1" class="r"/></g><g class="puff"><rect x="9" y="9" width="2" height="2" class="gy2"/></g><g class="puff t2"><rect x="20" y="9" width="2" height="2" class="gy2"/></g>
</svg>
