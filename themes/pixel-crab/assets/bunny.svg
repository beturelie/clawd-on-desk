<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges">
<title>兔兔 (bunny)</title>
<style>
.b{fill:#D97757}.b2{fill:#B65B3E}.k{fill:#221B17}.w{fill:#FFFFFF}
.p{fill:#FF8FA0}.p2{fill:#E8607A}.ang{fill:#E5484D}.ck{fill:#D9A55B}.sc{fill:#5B6FD6}.fi{fill:#4FA3C7}.sf{fill:#5DA9E9}.cap{fill:#4B5FC9}.cl{fill:#8F96A3}.wall{fill:#B9BFC7}.gd{fill:#2F8F5B}.brk{fill:#B5523B}.org{fill:#F08A3C}.scr{fill:#24302E}.ph{fill:#7FD99A}.dg{fill:#8B5A3C}.mt{fill:#D9B48A}.r{fill:#E5484D}.y{fill:#F7C948}.c{fill:#7CC8F2}.gr{fill:#6BCB77}
.o{fill:#3A302B}.f{fill:#FBF6EE}.gy{fill:#9AA0A8}.gy2{fill:#C9CDD2}
.sh{fill:#000;opacity:.18}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.hop{animation:hop .8s step-end infinite}
@keyframes hop{0%{transform:none}25%{transform:translateY(-2px)}50%{transform:translateY(-3px)}75%{transform:translateY(-1px)}}
.sh.fb{animation:shs .8s step-end infinite}
@keyframes shs{0%{transform:none}25%{transform:scaleX(.8)}75%{transform:none}}
.ua{animation:ua 2.4s step-end infinite}.ub{opacity:0;animation:ub 2.4s step-end infinite}
@keyframes ua{0%{opacity:1}60%{opacity:0}}
@keyframes ub{0%{opacity:0}60%{opacity:1}}</style>
<rect x="8" y="27" width="16" height="1" class="sh fb"/><g class="hop"><g class="b"><rect x="8" y="24" width="2" height="3"/><rect x="11" y="24" width="2" height="3"/><rect x="19" y="24" width="2" height="3"/><rect x="22" y="24" width="2" height="3"/><rect x="7" y="13" width="18" height="11"/><rect x="4" y="17" width="3" height="3"/><rect x="25" y="17" width="3" height="3"/></g><g class="b"><rect x="10" y="3" width="3" height="10"/></g><rect x="11" y="5" width="1" height="7" class="p"/><g class="ua"><g class="b"><rect x="19" y="3" width="3" height="10"/></g><rect x="20" y="5" width="1" height="7" class="p"/></g><g class="ub"><g class="b"><rect x="19" y="8" width="3" height="5"/><rect x="22" y="6" width="3" height="3"/><rect x="25" y="5" width="2" height="2"/></g><rect x="20" y="9" width="1" height="3" class="p"/></g><g class="k"><rect x="10" y="16" width="2" height="2"/><rect x="20" y="16" width="2" height="2"/></g><rect x="15" y="19" width="2" height="1" class="p"/><rect x="14" y="20" width="1" height="1" class="k"/><rect x="17" y="20" width="1" height="1" class="k"/><rect x="15" y="21" width="2" height="2" class="w"/><rect x="15" y="22" width="2" height="1" class="gy2"/><rect x="7" y="19" width="2" height="1" class="p"/><rect x="23" y="19" width="2" height="1" class="p"/></g>
</svg>
