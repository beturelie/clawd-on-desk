.wa{animation:wa .5s step-end infinite}.wb{animation:wb .5s step-end infinite}
@keyframes wa{0%{opacity:1}50%{opacity:0}}
@keyframes wb{0%{opacity:0}50%{opacity:1}}
.pop{animation:pop 1.4s step-end infinite}
