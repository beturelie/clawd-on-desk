<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges">
<title>写剧本 (script)</title>
<style>
.b{fill:#D97757}.b2{fill:#B65B3E}.k{fill:#221B17}.w{fill:#FFFFFF}
.p{fill:#FF8FA0}.p2{fill:#E8607A}.ang{fill:#E5484D}.ck{fill:#D9A55B}.sc{fill:#5B6FD6}.fi{fill:#4FA3C7}.sf{fill:#5DA9E9}.cap{fill:#4B5FC9}.cl{fill:#8F96A3}.wall{fill:#B9BFC7}.gd{fill:#2F8F5B}.brk{fill:#B5523B}.org{fill:#F08A3C}.scr{fill:#24302E}.ph{fill:#7FD99A}.r{fill:#E5484D}.y{fill:#F7C948}.c{fill:#7CC8F2}.gr{fill:#6BCB77}
.o{fill:#3A302B}.f{fill:#FBF6EE}.gy{fill:#9AA0A8}.gy2{fill:#C9CDD2}
.sh{fill:#000;opacity:.18}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.pen{animation:pen 2.4s step-end infinite}
@keyframes pen{0%{transform:none}25%{transform:translateX(-1px)}50%{transform:translateX(-2px)}75%{transform:translate(-1px,1px)}}
.l1{animation:l1 2.4s step-end infinite}.l2{opacity:0;animation:l2 2.4s step-end infinite}
@keyframes l1{0%{transform:scaleX(.25)}25%{transform:scaleX(.6)}50%{transform:none}}
@keyframes l2{0%{opacity:0}50%{opacity:1;transform:scaleX(.4)}75%{opacity:1;transform:none}}
.l1,.l2{transform-box:fill-box;transform-origin:left}</style>
<rect x="8" y="27" width="16" height="1" class="sh"/><g class="b"><rect x="8" y="24" width="2" height="3"/><rect x="11" y="24" width="2" height="3"/><rect x="19" y="24" width="2" height="3"/><rect x="22" y="24" width="2" height="3"/></g><g class="b"><rect x="7" y="13" width="18" height="11"/><rect x="4" y="17" width="3" height="3"/></g><g class="k"><rect x="10" y="17" width="2" height="2"/><rect x="20" y="17" width="2" height="2"/></g><rect x="15" y="21" width="2" height="1" class="k"/><rect x="17" y="21" width="1" height="2" class="p"/><rect x="7" y="22" width="18" height="5" class="o"/><rect x="8" y="23" width="16" height="3" class="f"/><g class="k l1"><rect x="10" y="23" width="12" height="1"/></g><g class="k l2"><rect x="10" y="25" width="10" height="1"/></g><g class="b"><rect x="25" y="17" width="3" height="3"/></g><g class="pen"><rect x="21" y="23" width="1" height="1" class="k"/><rect x="22" y="22" width="1" height="1" class="cap"/><rect x="23" y="21" width="1" height="1" class="cap"/><rect x="24" y="20" width="1" height="1" class="cap"/><rect x="25" y="19" width="1" height="1" class="cap"/><rect x="26" y="18" width="1" height="1" class="y"/></g>
</svg>
