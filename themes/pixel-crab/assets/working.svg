<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges">
<title>疯狂工作 (working)</title>
<style>
.b{fill:#D97757}.b2{fill:#B65B3E}.k{fill:#221B17}.w{fill:#FFFFFF}
.p{fill:#FF8FA0}.p2{fill:#E8607A}.ang{fill:#E5484D}.ck{fill:#D9A55B}.sc{fill:#5B6FD6}.fi{fill:#4FA3C7}.sf{fill:#5DA9E9}.cap{fill:#4B5FC9}.cl{fill:#8F96A3}.wall{fill:#B9BFC7}.gd{fill:#2F8F5B}.brk{fill:#B5523B}.org{fill:#F08A3C}.scr{fill:#24302E}.ph{fill:#7FD99A}.r{fill:#E5484D}.y{fill:#F7C948}.c{fill:#7CC8F2}.gr{fill:#6BCB77}
.o{fill:#3A302B}.f{fill:#FBF6EE}.gy{fill:#9AA0A8}.gy2{fill:#C9CDD2}
.sh{fill:#000;opacity:.18}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.head{animation:nod .3s step-end infinite}
@keyframes nod{0%{transform:none}50%{transform:translateY(1px)}}
.al{animation:al .2s step-end infinite}.ar{animation:ar .2s step-end infinite}
@keyframes al{0%{transform:none}50%{transform:translateY(-2px)}}
@keyframes ar{0%{transform:translateY(-2px)}50%{transform:none}}
.sweat{animation:sweat 1.2s steps(4) infinite}
@keyframes sweat{0%{transform:none;opacity:1}100%{transform:translate(2px,4px);opacity:0}}
.bit{animation:bit 1.2s steps(6) infinite;opacity:0}
.bit.t2{animation-delay:.4s}.bit.t3{animation-delay:.8s}
@keyframes bit{0%{transform:none;opacity:1}100%{transform:translateY(-12px);opacity:0}}
.ln{animation:ln .4s step-end infinite}
@keyframes ln{0%{opacity:1}50%{opacity:0}}</style>
<rect x="8" y="27" width="16" height="1" class="sh"/><g class="b"><rect x="8" y="24" width="2" height="3"/><rect x="11" y="24" width="2" height="3"/><rect x="19" y="24" width="2" height="3"/><rect x="22" y="24" width="2" height="3"/></g><g class="head"><g class="b"><rect x="7" y="13" width="18" height="11"/></g><g class="k"><rect x="10" y="15" width="2" height="2"/><rect x="20" y="15" width="2" height="2"/></g></g><g class="b al"><rect x="4" y="17" width="3" height="3"/></g><g class="b ar"><rect x="25" y="17" width="3" height="3"/></g><rect x="9" y="19" width="14" height="6" class="o"/><rect x="10" y="20" width="12" height="4" class="gy"/><rect x="10" y="20" width="12" height="1" class="gy2"/><rect x="16" y="21" width="1" height="1" class="b"/><rect x="15" y="22" width="1" height="1" class="b"/><rect x="16" y="22" width="1" height="1" class="b"/><rect x="17" y="22" width="1" height="1" class="b"/><rect x="16" y="23" width="1" height="1" class="b"/><rect x="7" y="25" width="18" height="1" class="o"/><g class="c sweat"><rect x="26" y="11" width="1" height="2"/></g><g class="ln"><rect x="0" y="15" width="3" height="1" class="o"/><rect x="1" y="19" width="2" height="1" class="o"/><rect x="29" y="15" width="3" height="1" class="o"/><rect x="29" y="19" width="2" height="1" class="o"/></g><g class="bit"><rect x="12" y="18" width="1" height="1" class="gr"/></g><g class="bit t2"><rect x="16" y="18" width="1" height="1" class="y"/></g><g class="bit t3"><rect x="20" y="18" width="1" height="1" class="c"/></g>
</svg>
