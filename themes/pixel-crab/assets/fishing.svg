<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges">
<title>钓鱼 (fishing)</title>
<style>
.b{fill:#D97757}.b2{fill:#B65B3E}.k{fill:#221B17}.w{fill:#FFFFFF}
.p{fill:#FF8FA0}.p2{fill:#E8607A}.ang{fill:#E5484D}.ck{fill:#D9A55B}.sc{fill:#5B6FD6}.fi{fill:#4FA3C7}.sf{fill:#5DA9E9}.cap{fill:#4B5FC9}.cl{fill:#8F96A3}.wall{fill:#B9BFC7}.gd{fill:#2F8F5B}.brk{fill:#B5523B}.org{fill:#F08A3C}.scr{fill:#24302E}.ph{fill:#7FD99A}.r{fill:#E5484D}.y{fill:#F7C948}.c{fill:#7CC8F2}.gr{fill:#6BCB77}
.o{fill:#3A302B}.f{fill:#FBF6EE}.gy{fill:#9AA0A8}.gy2{fill:#C9CDD2}
.sh{fill:#000;opacity:.18}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bob{animation:bob 3s step-end infinite}
@keyframes bob{0%{transform:none}25%{transform:translateY(1px)}50%{transform:none}80%{transform:translateY(3px)}95%{transform:none}}
.bang{opacity:0;animation:bang 3s step-end infinite}
@keyframes bang{0%{opacity:0}80%{opacity:1}95%{opacity:0}}
.ey{animation:ey 3s step-end infinite}.ew{opacity:0;animation:ew 3s step-end infinite}
@keyframes ey{0%{opacity:1}80%{opacity:0}95%{opacity:1}}
@keyframes ew{0%{opacity:0}80%{opacity:1}95%{opacity:0}}</style>
<rect x="8" y="27" width="16" height="1" class="sh"/><g class="b"><rect x="8" y="24" width="2" height="3"/><rect x="11" y="24" width="2" height="3"/><rect x="19" y="24" width="2" height="3"/><rect x="22" y="24" width="2" height="3"/></g><g class="b"><rect x="7" y="13" width="18" height="11"/><rect x="4" y="17" width="3" height="3"/><rect x="25" y="17" width="3" height="3"/></g><g class="k ey"><rect x="9" y="16" width="4" height="1"/><rect x="10" y="17" width="2" height="1"/><rect x="19" y="16" width="4" height="1"/><rect x="20" y="17" width="2" height="1"/></g><g class="ew"><g class="k"><rect x="10" y="15" width="2" height="3"/><rect x="20" y="15" width="2" height="3"/></g><g class="w"><rect x="10" y="15" width="1" height="1"/><rect x="20" y="15" width="1" height="1"/></g></g><rect x="15" y="21" width="2" height="1" class="k"/><g class="o"><rect x="27" y="15" width="1" height="2"/><rect x="28" y="13" width="1" height="2"/><rect x="29" y="11" width="1" height="2"/><rect x="30" y="9" width="1" height="2"/><rect x="31" y="7" width="1" height="2"/></g><g class="bob"><rect x="31" y="9" width="1" height="13" class="gy"/><rect x="30" y="22" width="3" height="1" class="r"/><rect x="30" y="23" width="3" height="1" class="y"/></g><rect x="26" y="26" width="6" height="1" class="c"/><g class="y bang"><rect x="16" y="4" width="2" height="5"/><rect x="16" y="10" width="2" height="2"/></g>
