.d1{animation:d1 1.6s step-end infinite}.d2{animation:d2 1.6s step-end infinite}.d3{animation:d3 1.6s step-end infinite}
@keyframes d1{0%{opacity:0}25%{opacity:1}}
@keyframes d2{0%{opacity:0}50%{opacity:1}}
@keyframes d3{0%{opacity:0}75%{opacity:1}}</style>
