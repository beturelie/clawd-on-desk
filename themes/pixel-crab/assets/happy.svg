<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges">
<title>完成庆祝 (happy)</title>
<style>
.b{fill:#D97757}.b2{fill:#B65B3E}.k{fill:#221B17}.w{fill:#FFFFFF}
.p{fill:#FF8FA0}.p2{fill:#E8607A}.ang{fill:#E5484D}.ck{fill:#D9A55B}.sc{fill:#5B6FD6}.fi{fill:#4FA3C7}.sf{fill:#5DA9E9}.cap{fill:#4B5FC9}.cl{fill:#8F96A3}.wall{fill:#B9BFC7}.gd{fill:#2F8F5B}.brk{fill:#B5523B}.org{fill:#F08A3C}.scr{fill:#24302E}.ph{fill:#7FD99A}.r{fill:#E5484D}.y{fill:#F7C948}.c{fill:#7CC8F2}.gr{fill:#6BCB77}
.o{fill:#3A302B}.f{fill:#FBF6EE}.gy{fill:#9AA0A8}.gy2{fill:#C9CDD2}
.sh{fill:#000;opacity:.18}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.jump{animation:jump 1s step-end infinite}
@keyframes jump{0%{transform:none}20%{transform:translateY(-2px)}35%{transform:translateY(-4px)}55%{transform:translateY(-2px)}70%{transform:none}}
.sh.fb{animation:shs 1s step-end infinite}
@keyframes shs{0%{transform:none}20%{transform:scaleX(.75)}55%{transform:scaleX(.75)}70%{transform:none}}
.arms{animation:wave .5s step-end infinite}
@keyframes wave{0%{transform:none}50%{transform:translateY(1px)}}
.cf{animation:fall 1.6s steps(8) infinite}
.cf.t1{animation-delay:-.4s}.cf.t2{animation-delay:-.8s}.cf.t3{animation-delay:-1.2s}
@keyframes fall{0%{transform:none;opacity:1}100%{transform:translateY(14px);opacity:0}}</style>
<rect x="8" y="27" width="16" height="1" class="sh fb"/><g class="jump"><g class="b"><rect x="8" y="24" width="2" height="3"/><rect x="11" y="24" width="2" height="3"/><rect x="19" y="24" width="2" height="3"/><rect x="22" y="24" width="2" height="3"/><rect x="7" y="13" width="18" height="11"/></g><g class="b arms"><rect x="5" y="10" width="2" height="4"/><rect x="25" y="10" width="2" height="4"/></g><rect x="10" y="15" width="1" height="1" class="k"/><rect x="11" y="15" width="1" height="1" class="k"/><rect x="9" y="16" width="1" height="1" class="k"/><rect x="12" y="16" width="1" height="1" class="k"/><rect x="20" y="15" width="1" height="1" class="k"/><rect x="21" y="15" width="1" height="1" class="k"/><rect x="19" y="16" width="1" height="1" class="k"/><rect x="22" y="16" width="1" height="1" class="k"/><rect x="15" y="19" width="2" height="1" class="k"/></g><g class="cf t0"><rect x="3" y="0" width="1" height="1" class="r"/></g><g class="cf t1"><rect x="9" y="2" width="1" height="2" class="y"/></g><g class="cf t2"><rect x="14" y="0" width="1" height="1" class="c"/></g><g class="cf t3"><rect x="19" y="3" width="1" height="2" class="gr"/></g><g class="cf t0"><rect x="24" y="1" width="1" height="1" class="p"/></g><g class="cf t1"><rect x="29" y="2" width="1" height="2" class="y"/></g><g class="cf t2"><rect x="6" y="5" width="1" height="1" class="c"/></g><g class="cf t3"><rect x="27" y="6" width="1" height="2" class="r"/></g>
</svg>
