<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges">
<title>待机 (idle)</title>
<style>
.b{fill:#D97757}.b2{fill:#B65B3E}.k{fill:#221B17}.w{fill:#FFFFFF}
.p{fill:#FF8FA0}.p2{fill:#E8607A}.ang{fill:#E5484D}.ck{fill:#D9A55B}.sc{fill:#5B6FD6}.fi{fill:#4FA3C7}.sf{fill:#5DA9E9}.cap{fill:#4B5FC9}.cl{fill:#8F96A3}.wall{fill:#B9BFC7}.gd{fill:#2F8F5B}.brk{fill:#B5523B}.org{fill:#F08A3C}.scr{fill:#24302E}.ph{fill:#7FD99A}.r{fill:#E5484D}.y{fill:#F7C948}.c{fill:#7CC8F2}.gr{fill:#6BCB77}
.o{fill:#3A302B}.f{fill:#FBF6EE}.gy{fill:#9AA0A8}.gy2{fill:#C9CDD2}
.sh{fill:#000;opacity:.18}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.eo{animation:eo 4s step-end infinite}.ec{opacity:0;animation:ec 4s step-end infinite}
@keyframes eo{0%{opacity:1}88%{opacity:0}92%{opacity:1}}
@keyframes ec{0%{opacity:0}88%{opacity:1}92%{opacity:0}}

.up{animation:breathe 2.4s step-end infinite}
@keyframes breathe{0%{transform:none}50%{transform:translateY(1px)}}
#eyes-js,#body-js,#shadow-js{transition:transform .2s ease-out}
#shadow-js{transform-origin:16px 27px}</style>
<g id="shadow-js"><rect x="8" y="27" width="16" height="1" class="sh"/></g><g class="b"><rect x="8" y="23" width="2" height="4"/><rect x="11" y="23" width="2" height="4"/><rect x="19" y="23" width="2" height="4"/><rect x="22" y="23" width="2" height="4"/></g><g id="body-js"><g class="up"><g class="b"><rect x="7" y="13" width="18" height="11"/><rect x="4" y="17" width="3" height="3"/><rect x="25" y="17" width="3" height="3"/></g><g id="eyes-js"><g class="k eo"><rect x="10" y="15" width="2" height="3"/><rect x="20" y="15" width="2" height="3"/></g><g class="k ec"><rect x="10" y="17" width="2" height="1"/><rect x="20" y="17" width="2" height="1"/></g></g></g></g>
</svg>
