@keyframes yawn{0%{opacity:0}40%{opacity:1}68%{opacity:0}}
@keyframes lip{0%{opacity:1}40%{opacity:0}68%{opacity:1}}
.nod{animation:nod 4s step-end infinite}
@keyframes nod{0%{transform:none}70%{transform:translateY(1px)}80%{transform:translateY(2px)}92%{transform:none}}
.zz{opacity:0;animation:zz 4s step-end infinite}
